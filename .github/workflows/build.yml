name: Build TC Chat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Validate D1 migration locally
        run: npm run db:migrate:local
        env:
          VITE_TC_OAUTH_CLIENT_ID: ${{ secrets.VITE_TC_OAUTH_CLIENT_ID }}
